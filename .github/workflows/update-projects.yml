
name: Automatically Update GitHub Profile

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-projects.yml"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Discover and generate projects
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const owner = 'chaladitulasiram';
            const readmePath = 'README.md';

            // Exact README markers
            const startMarker = '<!-- AUTO-PROJECTS:START -->';
            const endMarker = '<!-- AUTO-PROJECTS:END -->';

            // Read README
            const original = fs.readFileSync(
              readmePath,
              'utf8'
            );

            // Find marker positions
            const startIndex = original.indexOf(startMarker);
            const endIndex = original.indexOf(endMarker);

            // Validate markers
            if (
              startIndex === -1 ||
              endIndex === -1 ||
              endIndex < startIndex + startMarker.length
            ) {
              core.setFailed(
                'README markers missing or incorrectly ordered. Check README.md on main.'
              );
              return;
            }

            core.info('README markers verified successfully.');

            // Discover portfolio repositories
            const response = await github.rest.search.repos({
              q: `user:${owner} topic:portfolio fork:false`,
              sort: 'updated',
              order: 'desc',
              per_page: 100
            });

            const repositories = response.data.items
              .filter(repo =>
                repo.owner.login.toLowerCase() === owner &&
                !repo.fork &&
                !repo.archived &&
                repo.name.toLowerCase() !== owner
              )
              .slice(0, 12);

            core.info(
              `Found ${repositories.length} portfolio repositories.`
            );

            // Escape generated HTML content
            function escapeHtml(value) {
              return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
            }

            // Generate project cards
            const cards = repositories.map(repo => {
              const name = escapeHtml(repo.name);

              const description = escapeHtml(
                repo.description || 'Project description coming soon.'
              );

              const language = escapeHtml(
                repo.language || 'Not specified'
              );

              const stars = repo.stargazers_count;

              const updated = new Date(
                repo.pushed_at || repo.updated_at
              ).toISOString().slice(0, 10);

              return [
                '<details>',
                `<summary><strong>${name}</strong> — ${language} · ★ ${stars}</summary>`,
                '',
                description,
                '',
                `[Explore Repository](${repo.html_url}) · Last updated: ${updated}`,
                '',
                '</details>'
              ].join('\n');
            }).join('\n\n');

            const generatedContent = cards ||
              '_No repositories tagged with `portfolio` yet._';

            // Replace content between markers
            const before = original.slice(
              0,
              startIndex + startMarker.length
            );

            const after = original.slice(endIndex);

            const updatedReadme = [
              before,
              '',
              generatedContent,
              '',
              after
            ].join('\n');

            // Write updated README
            fs.writeFileSync(
              readmePath,
              updatedReadme,
              'utf8'
            );

            core.info('README project section generated successfully.');

      - name: Commit profile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No profile changes detected."
          else
            git commit -m "chore: automatically update project showcase"
            git push
          fi
